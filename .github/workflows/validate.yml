name: Validate skill

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install skills-ref==0.1.1
      - run: agentskills validate skills/bmad-ecosystem
